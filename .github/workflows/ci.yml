name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: gradlew.bat build
        shell: cmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-windows
          path: build/reports/tests/test
  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: gradlew.bat build
        shell: cmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-windows-arm
          path: build/reports/tests/test
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-linux
          path: build/reports/tests/test
  linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-linux-arm
          path: build/reports/tests/test
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-macos
          path: build/reports/tests/test
  macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-macos-arm
          path: build/reports/tests/test
