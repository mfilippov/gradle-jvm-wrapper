name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: gradlew.bat build
        shell: cmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-windows
          path: build/reports/tests/test
  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: gradlew.bat build
        shell: cmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-windows-arm
          path: build/reports/tests/test
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-linux
          path: build/reports/tests/test
  linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-linux-arm
          path: build/reports/tests/test
  linux-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e TEST_LINUX_X64_JVM_URL=https://corretto.aws/downloads/latest/amazon-corretto-21-x64-alpine-jdk.tar.gz \
            alpine:3.22 sh -c '
              set -e
              apk add --no-cache openjdk21-jdk curl musl-utils >/dev/null
              java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --no-daemon --console=plain test \
                --tests "me.filippov.gradle.jvm.wrapper.PluginTest.smokeParallelRun" \
                --tests "me.filippov.gradle.jvm.wrapper.PluginTest.smokeSelfHealAfterBrokenInstall" \
                --tests "me.filippov.gradle.jvm.wrapper.PluginTest.staleLockReportsClearError"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-linux-musl
          path: build/reports/tests/test
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-macos
          path: build/reports/tests/test
  macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: ./gradlew build
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-macos-arm
          path: build/reports/tests/test
